# Publishes the rolling "nightly" pre-release from main, built against upstream
# rtl-sdr-blog master. Runs when a pull request is merged, and on a daily
# schedule to pick up upstream changes; the schedule skips when nothing changed.
name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      upstream: ${{ steps.decide.outputs.upstream }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source native/versions.env
          upstream="$(git ls-remote "$RTLSDR_REPOSITORY" refs/heads/master | cut -f1)"
          marker="Built from ${GITHUB_SHA} and rtl-sdr-blog ${upstream}"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             gh release view nightly --json body --jq .body 2>/dev/null | grep -qF "$marker"; then
            build=false
          fi
          {
            echo "build=$build"
            echo "upstream=$upstream"
            echo "version=${RTLSDR_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      rtlsdr_ref: master

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: native

      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          # librtlsdr is GPL: publish its exact source, with the jRTL patches
          # the build applied, next to the binaries. The commit and patches come
          # from the jar, in case master moved during the build.
          main_jar="$(ls jars/jrtl-*.jar | grep -Ev -- '-(sources|javadoc)\.jar$')"
          unzip -p "$main_jar" jrtl/native/linux-x86_64/build-info.properties > build-info.properties
          commit="$(sed -n 's/^rtlsdr.commit=//p' build-info.properties)"
          patches="$(sed -n 's/^rtlsdr.patches=//p' build-info.properties)"
          ./native/source-archive.sh build-info.properties "rtl-sdr-blog-${commit::12}" \
            "jars/rtl-sdr-blog-${commit::12}-source.tar.gz"
          (cd jars && sha256sum * > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly jars/* --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of main. Not for production use.

          Built from ${GITHUB_SHA} and rtl-sdr-blog ${UPSTREAM}

          jRTL patches applied: ${patches:-none}"
